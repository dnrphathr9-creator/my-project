services:
  db:
    image: mysql:8.4
    container_name: simple-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  pma:
    image: phpmyadmin
    container_name: simple-pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
